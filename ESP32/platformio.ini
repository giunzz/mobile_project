[platformio]
src_dir = .

[env:freenove_esp32_s3_wroom]
platform = espressif32@6.11.0
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<*.ino> +<*.cpp> +<*.c>
lib_deps =
    madhephaestus/ESP32Servo@3.2.1
    bogde/HX711@0.7.5
    mobizt/FirebaseClient@2.2.13
